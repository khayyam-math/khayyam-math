#
# Every field is human-written.  No copy is auto-generated, so we
# cannot ship a hallucinated false claim about a math concept.
#
# To add a topic: append an entry below, run scripts/bake_learn_pages.py,
# commit the resulting service/static/learn/<slug>.html.
#
