<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Khayyam Math">
  <title>Khayyam Math</title>
  <!-- A "K" built from "|<": a vertical bar (the pipe) and a chevron
       (the less-than) held a small distance apart, so the "|<" reads. -->
  <g fill="none" stroke="#1f6fe0" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- | the pipe -->
    <line x1="27" y1="18" x2="27" y2="82"/>
    <!-- < the chevron: vertex pulled right of the bar to leave a gap -->
    <polyline points="78,20 44,50 78,80"/>
  </g>
</svg>
