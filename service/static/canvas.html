<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khayyam Math — live canvas</title>
<style>
  :root {
    /* Force light color scheme inside the canvas iframe — figures are
       drawn for a white background and our dark-mode override would
       paint half the iframe near-black, which the user reported as
       "the canvas has good size but a part has white background, the
       rest is black." */
    color-scheme: light;
    --bg: #ffffff;
    --fg: #222;
    --muted: #777;
    --accent: #2a6df4;
    --highlight: #fbbf24;
    --border: #e0e0e0;
  }
  /* Canvas figures are drawn for a WHITE background (black strokes,
     dark text, light fills) — switching the iframe body to dark mode
     while the SVG #stage stayed white made the canvas look split
     "half white, half black."  Force a white iframe background
     regardless of system color scheme.  --fg / --border still flip
     so the header chrome remains legible in dark mode. */
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eee; --muted: #888; --border: #333; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none;
  }
  body { height: 100dvh; }
  header {
    display: flex; align-items: center; gap: 1em;
    padding: 0.5em 1em;
    border-bottom: 1px solid var(--border);
    font-size: 0.85em;
    flex-wrap: wrap;
    /* Pin the header (and the Play-narration button it carries) so it
       stays visible regardless of how the figure or the host page
       scrolls. */
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
  }
  header .title { font-weight: 600; }
  header .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  header .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ccc; transition: background 200ms;
  }
  header .dot.live { background: #22c55e; box-shadow: 0 0 6px #22c55e80; }
  header .dot.disconnected { background: #ef4444; }
  header button.play-btn {
    margin-left: auto;
    padding: 0.4em 0.9em;
    font-size: 0.9em;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: white;
    cursor: pointer;
    /* Make the play button thumb-friendly on touch. */
    min-height: 40px; min-width: 40px;
  }
  header button.play-btn:disabled {
    opacity: 0.6;
    cursor: progress;
    background: var(--muted);
    border-color: var(--muted);
    animation: emergePulse 1.6s ease-in-out infinite;
  }
  @keyframes emergePulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.85; }
  }
  header button.play-btn.hidden { display: none; }
  main {
    display: flex; align-items: center; justify-content: center;
    /* 100dvh accounts for iOS Safari's collapsing URL bar; falls back
       to 100vh on browsers that don't support dvh. */
    height: calc(100dvh - 50px);
    padding: 1em;
    padding-bottom: max(1em, env(safe-area-inset-bottom));
  }
  @media (max-width: 720px) {
    header { padding: 0.4em 0.7em; gap: 0.6em; font-size: 0.8em; }
    header button.play-btn { padding: 0.35em 0.75em; font-size: 0.85em; }
    main {
      padding: 0.5em;
      height: calc(100dvh - 44px);
      /* The canvas must be SLIDABLE on mobile — user asked four times.
         The SVG keeps its native 900×650 viewBox so text stays
         readable; <main> scrolls inside the iframe to pan over the
         oversized figure.  Explicitly enable both axes, smooth
         momentum scrolling on iOS, and a visible scrollbar so the
         user can SEE the pan affordance.  touch-action lets one-
         finger drag pan in both directions without being hijacked
         by the parent page's vertical scroll. */
      overflow: auto !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      scrollbar-width: thin;
    }
    main::-webkit-scrollbar { width: 8px; height: 8px; }
    main::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 4px;
    }
    main::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.06);
    }
    /* SVG sizing on mobile: fit the iframe width when feasible, but
       NEVER below a readable minimum.
         - width:100% → fit the container horizontally
         - min-width:640px → if container is narrower (e.g. 375-px
           iPhone), the SVG stays 640 px wide so text in a 900-px
           viewBox renders at ~71% scale (font-size 16 → 11.4 px,
           which is right at the legibility floor).
         - height:auto preserves aspect ratio.
       On a phone narrower than 640 px, <main>'s overflow:auto
       activates: user pans horizontally for the ~265 px sliver that
       doesn't fit.  On a phone ≥640 px wide, the SVG fully fits.
       This is the "matching but slidable" middle ground the user
       asked for — figure mostly visible, no microscopic text, no
       silent edge-clip. */
    #stage svg {
      width: 100% !important;
      height: auto !important;
      min-width: 640px !important;
      max-width: none !important;
      max-height: none !important;
      min-height: 0 !important;
    }
  }
  #stage {
    max-width: 100%; max-height: 100%;
    /* No border/shadow on the stage container.  Earlier the stage
       had a 1-px grey border + drop shadow that drew a rectangle
       around the SVG's entire viewBox — so when a small figure sat
       inside a tall viewBox, the user saw the figure floating
       inside a "useless square" of empty whitespace.  Removing the
       chrome makes the figure blend into the iframe background; the
       SVG content itself supplies whatever framing it needs. */
    background: white;
  }
  /* Scroll behaviour: when the figure exceeds the visible area
     (either because the model emitted content outside the viewBox
     or because the iframe is narrower than the figure's natural
     width), the user must be able to pan the canvas instead of
     having content silently clipped or shrunk into illegibility.
     `main` uses a block layout (NOT flex) so its `overflow: auto`
     can produce real scrollbars — `display: flex; justify-content:
     center` would pin overflow to the centre and hide both edges.
     The inline-block #stage centres horizontally via `text-align`
     on `main` for the "fits comfortably" case. */
  main {
    /* Block layout (overriding the earlier display:flex) so the
       figure pins to the TOP of the canvas — flex align-items:center
       was vertically centring a short figure and leaving a large
       empty band above it. #stage is inline-block vertical-align:top,
       centred horizontally by text-align. */
    display: block;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    text-align: center;
  }
  #stage {
    display: inline-block;
    vertical-align: top;
  }
  /* SVG sizing.  `width:auto` makes the SVG render at its viewBox
     natural size.  A JS-applied min-width / min-height (set to the
     viewBox dimensions after every injection) keeps the figure at
     its natural readable scale when the container is NARROWER than
     the viewBox — at that point `main` scrolls instead of shrinking
     text to dust.  `overflow: visible` lets out-of-viewBox content
     render too (combined with the JS viewBox-expand pass below, this
     catches model-emitted overflow). */
  #stage svg { display: block;
               width: auto;
               height: auto;
               max-width: none; max-height: none;
               margin: 0 auto;
               overflow: visible; }
  .pulse { animation: pulse 400ms ease-out; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(42,109,244,0.5); }
    100% { box-shadow: 0 0 0 12px rgba(42,109,244,0); }
  }
  /* Narration highlight: applied to whichever element matches the
     narration phrase's highlight id.  Two SVG-emission styles to
     cover:
       (a) wrapped — <g id="v1"><circle/><text>1</text></g>; class
           goes on the <g>, child rules below style each inner shape.
       (b) flat — <circle id="v1"/>; class goes directly on the
           <circle>, so the rules must also match the shape itself.
     Without the "self" variant a flat-emitted figure (the GPT-4o
     default) animated only its drop-shadow halo, which on a small
     leaf element looked like nothing was highlighted at all. */
  #stage svg .sevim-highlight {
    animation: sevim-highlight-pulse 0.9s ease-in-out infinite;
  }
  /* Highlighted element OR its inner shapes — both get the yellow
     stroke treatment so the spot is unmistakable. */
  #stage svg rect.sevim-highlight,
  #stage svg circle.sevim-highlight,
  #stage svg ellipse.sevim-highlight,
  #stage svg polygon.sevim-highlight,
  #stage svg path.sevim-highlight,
  #stage svg line.sevim-highlight,
  #stage svg .sevim-highlight rect,
  #stage svg .sevim-highlight circle,
  #stage svg .sevim-highlight ellipse,
  #stage svg .sevim-highlight polygon,
  #stage svg .sevim-highlight path,
  #stage svg .sevim-highlight line {
    stroke: var(--highlight) !important;
    stroke-width: 5 !important;
  }
  /* Tiny point circles have radius ~4-5 px — a 5 px stroke can swallow
     them.  Override fill to bright yellow so the dot itself glows. */
  #stage svg circle.sevim-highlight,
  #stage svg .sevim-highlight circle {
    fill: var(--highlight) !important;
  }
  /* Edges (paths/lines) get a thicker, fully opaque highlight stroke
     so they remain visible against the background. */
  #stage svg path.sevim-highlight,
  #stage svg line.sevim-highlight,
  #stage svg .sevim-highlight path,
  #stage svg .sevim-highlight line {
    stroke-width: 4 !important;
    stroke-opacity: 1 !important;
  }
  /* Text labels (vertex numbers, axis labels) — also legitimate
     highlight targets.  Outline them in the highlight colour so the
     glyphs stay readable instead of being filled-over. */
  #stage svg text.sevim-highlight,
  #stage svg .sevim-highlight text,
  /* <tspan id="..."> lets the model highlight INDIVIDUAL variables or
     sub-formulas inside a single <text> element — e.g. the "x" inside
     "(x + y + z)" or the "b² - 4ac" discriminant inside a longer
     equation.  Without this rule a tspan with .sevim-highlight would
     inherit the parent text colour and the user's eye gets no cue. */
  /* Karaoke-style word-level highlight — driven by tickWord() in the
     script below.  Brighter than the phrase highlight so the eye
     tracks the currently-spoken word even while a larger phrase
     highlight is active.  No animation: the word changes every
     ~0.3s on average, an infinite pulse would be visual noise. */
  #stage svg tspan.sevim-word {
    fill: #d97706 !important;        /* darker amber */
    font-weight: 800 !important;
    text-decoration: underline;
    text-decoration-thickness: 1.5px;
    text-decoration-color: #d97706;
  }
  #stage svg tspan.sevim-highlight,
  #stage svg .sevim-highlight tspan {
    fill: var(--highlight) !important;
    font-weight: 800 !important;
  }
  @keyframes sevim-highlight-pulse {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(251,191,36,0.8)); }
    50%      { filter: drop-shadow(0 0 14px rgba(251,191,36,1.0)); }
  }
  /* Audio-unlock hint — non-blocking corner pill instead of a modal.
     Any click or keypress on the page unlocks autoplay; the hint
     fades out after the first interaction. */
  .play-overlay {
    position: fixed;
    bottom: 12px; right: 12px;
    background: rgba(42,109,244,0.92); color: white;
    padding: 0.5em 0.9em;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    font-size: 0.85em;
    z-index: 1000;
    cursor: pointer;
    transition: opacity 0.3s;
  }
  .play-overlay .panel { display: contents; }
  .play-overlay .panel button {
    background: transparent;
    border: none;
    color: white;
    font-size: 0.95em;
    cursor: pointer;
    padding: 0;
  }
  .play-overlay h3, .play-overlay p { display: none; }
  .play-overlay.hidden { display: none; }
  /* When the viewer is embedded inside Studio's iframe the parent
     window already shows a Play button in its own chrome, so this
     floating overlay is redundant — and on mobile the small iframe
     content area makes it sit on top of the figure (it covered the
     cos(π/4) label in the audit screenshots).  The .embedded class
     is set by JS when window !== window.top. */
  body.embedded .play-overlay { display: none !important; }
  /* Mobile: hide the developer-oriented meta info in the canvas
     header (canvas_id, revision number, node/edge counts, clock).
     They're useful on the standalone viewer for debugging but waste
     ~40px of premium vertical space on a 390px-wide phone. */
  @media (max-width: 640px) {
    body.embedded header .meta { display: none; }
    body.embedded header { padding: 0.25em 0.5em; gap: 0.35em; }
    body.embedded header .title { font-size: 0.85em; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="status-dot"></span>
  <span class="title">Khayyam Math canvas</span>
  <span class="meta" id="cid"></span>
  <span class="meta">rev <span id="rev">0</span></span>
  <span class="meta"><span id="nodes">0</span> nodes / <span id="edges">0</span> edges</span>
  <span class="meta" id="updated"></span>
  <button class="play-btn hidden" id="play-btn" type="button" style="display:none">▶ Play narration</button>
</header>
<main>
  <div id="stage">
    <p style="color: var(--muted); padding: 2em; text-align: center;">
      Waiting for the LLM to add the first node…
    </p>
  </div>
</main>
<audio id="intro-audio" preload="auto"></audio>
<audio id="narration-audio" preload="auto"></audio>
<div class="play-overlay" id="play-overlay">
  <div class="panel">
    <button id="overlay-play" type="button">▶ Play narration</button>
  </div>
</div>
<script>
  // Mark the body as `embedded` when this viewer is loaded inside an
  // iframe (Studio's canvas pane).  The CSS rules above use this class
  // to (a) hide the redundant floating Play overlay that otherwise
  // covers figure content on small mobile viewports, and (b) compact
  // the dev-debug meta info in the header.
  if (window !== window.top) document.body.classList.add('embedded');

  const cid = document.body.dataset.cid || (() => {
    const m = window.location.pathname.match(/\/canvas\/([^/]+)\/view/);
    return m ? m[1] : null;
  })();
  if (cid) document.getElementById('cid').textContent = cid;

  const stage = document.getElementById('stage');
  const dot = document.getElementById('status-dot');
  const revEl = document.getElementById('rev');
  const nodesEl = document.getElementById('nodes');
  const edgesEl = document.getElementById('edges');
  const updatedEl = document.getElementById('updated');
  const intro = document.getElementById('intro-audio');
  const audio = document.getElementById('narration-audio');
  const playBtn = document.getElementById('play-btn');
  const overlay = document.getElementById('play-overlay');
  const overlayPlay = document.getElementById('overlay-play');

  // Narration manifest currently driving the highlight schedule.
  let narration = null;            // {duration_s, phrases: [...]}
  let activePhraseIndex = -1;
  let userInteracted = false;      // tracks whether autoplay is unlocked
  let introLoaded = null;          // url of currently-loaded intro audio
  let introPlayed = false;         // already finished one intro this session

  // ── All-piper audio: one voice for prelude AND walkthrough ───────────
  // Web Speech was producing a robotic, too-fast voice that didn't match
  // piper's Lessac-medium voice used for the main narration.  Drop it
  // entirely — we now wait the ~1-2 s for piper to synthesise the
  // prelude, and play one consistent voice through the whole session.

  // Aggressive autoplay strategy:
  //   1. Try audio.play() / intro.play() the moment the source is loaded.
  //   2. Try again on every state update from SSE.
  //   3. Listen for ANY user interaction (click / keydown / scroll /
  //      mousemove / touchstart) and retry on first gesture.
  // Browsers grant per-origin autoplay after a small amount of user
  // engagement, so once the user has interacted with localhost:7777
  // (or whichever port we landed on) once, every subsequent session
  // autoplays without any click.

  function tryPlayChain() {
    console.log('[viewer] tryPlayChain', {
      introSrc: !!intro.src, introPaused: intro.paused, introPlayed,
      audioSrc: !!audio.src, audioPaused: audio.paused,
    });
    if (intro.src && intro.paused && !introPlayed) {
      intro.play().then(() => {
        console.log('[viewer] intro.play() resolved');
        userInteracted = true;
      }).catch((e) => {
        console.warn('[viewer] intro.play() rejected:', e.name, e.message);
        overlay.classList.remove('hidden');
      });
      return;
    }
    // Don't start narration while intro is still queued.  The intro
    // 'ended' handler is the *only* place that hands off to narration —
    // otherwise an SSE state-update mid-intro would land here, fire
    // audio.play(), and the mutual-exclusion safety net would silence
    // the intro that was already speaking.
    if (intro.src && !introPlayed) {
      console.log('[viewer] tryPlayChain: intro queued, deferring narration');
      return;
    }
    if (audio.src && audio.paused) {
      audio.play().then(() => {
        console.log('[viewer] audio.play() resolved');
        userInteracted = true;
      }).catch((e) => {
        console.warn('[viewer] audio.play() rejected:', e.name, e.message);
        overlay.classList.remove('hidden');
      });
    }
  }

  // ── Audio playback policy: explicit Play only ──────────────────────
  // Earlier versions tried to autoplay on canplay AND on every random
  // user gesture (click, keydown, touchstart anywhere on the page).
  // That meant a user who clicked the chat input or the canvas itself
  // got audio they didn't ask for — which they reasonably called a
  // bug.  New policy: audio NEVER starts on its own.  The header's
  // Play button (or the centred overlay button) is the only trigger.
  // Once playback starts, the standard browser <audio> controls (when
  // exposed) handle pause / resume / seek.

  // Header Play button has three states:
  //   hidden     — initial load, before any figure has been requested
  //   emerging   — partial SVG arrived, but no final narration yet
  //                (or a retry kicked off after a prior figure landed).
  //                Visible but disabled, label reads "Emerging…".
  //   ready      — final narration delivered AND its audio fired canplay.
  //                Enabled, label reads "▶ Play narration".
  // The intermediate "emerging" state is important because the express
  // loop streams SVG chunks during retries — clicking Play on the prior
  // turn's audio while a new figure is being drawn produces a narration
  // that doesn't match the figure on screen.
  let playBtnReady = false;
  function showPlayEmerging() {
    playBtn.classList.remove('hidden');
    playBtn.style.display = '';
    playBtn.disabled = true;
    playBtn.textContent = 'Emerging…';
    playBtnReady = false;
  }
  function showPlayReady() {
    playBtn.classList.remove('hidden');
    playBtn.style.display = '';
    playBtn.disabled = false;
    playBtn.textContent = '▶ Play narration';
    playBtnReady = true;
  }
  // Only flip to READY once BOTH the narration manifest arrived AND
  // the <audio>'s data is loaded; otherwise a click would 404 on the
  // not-yet-written WAV.
  let narrationManifestReady = false;
  function maybeFlipReady() {
    if (narrationManifestReady && audio.src && audio.readyState >= 2) {
      showPlayReady();
    }
  }
  intro.addEventListener('canplay', maybeFlipReady);
  audio.addEventListener('canplay', maybeFlipReady);

  // Prelude finished → start the narration WAV (which begins with
  // the transition phrase server-side).
  intro.addEventListener('ended', () => {
    introPlayed = true;
    if (audio.src && audio.paused) {
      audio.play().then(() => {
        overlay.classList.add('hidden');
      }).catch(() => overlay.classList.remove('hidden'));
    }
  });

  // Hide the corner pill the moment ANY audio actually starts playing —
  // intro WAV first (when present), narration WAV after.  This is the
  // only signal that proves audio reached the user.
  audio.addEventListener('play', () => {
    overlay.classList.add('hidden');
    // Mutual-exclusion safety net: if intro somehow ended up playing
    // alongside narration, silence it.  The race fixed in onNarrationReady
    // should prevent this from happening, but the pause is cheap.
    if (!intro.paused) intro.pause();
  });
  intro.addEventListener('play', () => {
    overlay.classList.add('hidden');
    if (!audio.paused) audio.pause();
  });

  // After an SVG is injected into #stage, (a) expand its viewBox so
  // any content the model painted outside the original viewBox bounds
  // is included, and (b) set min-width / min-height on the SVG to the
  // viewBox dimensions so a narrow container scrolls instead of
  // shrinking text into illegibility.  Safe to call on any SVG; no-op
  // when getBBox is unavailable (e.g. hidden tab) or returns empty.
  function fitSvgToContent(svg) {
    if (!svg || svg.tagName.toLowerCase() !== 'svg') return;
    let bbox;
    try { bbox = svg.getBBox(); } catch (_) { return; }
    if (!bbox || (bbox.width <= 0 && bbox.height <= 0)) return;
    const parts = (svg.getAttribute('viewBox') || '0 0 900 650')
      .split(/[\s,]+/).map(Number);
    let [vx, vy, vw, vh] = (parts.length >= 4)
      ? parts : [0, 0, 900, 650];
    const PAD = 8;
    const cl = bbox.x - PAD;
    const ct = bbox.y - PAD;
    const cr = bbox.x + bbox.width + PAD;
    const cb = bbox.y + bbox.height + PAD;
    const nx = Math.min(vx, cl);
    const ny = Math.min(vy, ct);
    const nw = Math.max(vx + vw, cr) - nx;
    const nh = Math.max(vy + vh, cb) - ny;
    if (nx !== vx || ny !== vy || nw !== vw || nh !== vh) {
      svg.setAttribute('viewBox', `${nx} ${ny} ${nw} ${nh}`);
    }
    // Cap the min dimensions so a runaway model output (viewBox
    // 4000px wide) doesn't make scrolling feel infinite.  1100 / 800
    // is a comfortable readable scale on any device.
    svg.style.minWidth  = `${Math.min(nw, 1100)}px`;
    svg.style.minHeight = `${Math.min(nh, 800)}px`;
    // After the SVG settles, center `main`'s scroll on the content
    // bounding box.  Without this, the default scroll position is
    // (0, 0) — when the model lays out its figure on the right half
    // of viewBox, the user sees an empty left half and has to
    // discover horizontal scrolling.
    requestAnimationFrame(() => {
      try {
        const main = svg.closest('main');
        if (!main) return;
        const svgRect = svg.getBoundingClientRect();
        const mainRect = main.getBoundingClientRect();
        if (!svgRect.width || !svgRect.height) return;
        // bbox is in viewBox units; convert to client px proportional
        // to the rendered SVG size.
        const scaleX = svgRect.width / nw;
        const scaleY = svgRect.height / nh;
        const contentCx = (bbox.x + bbox.width / 2 - nx) * scaleX;
        const contentCy = (bbox.y + bbox.height / 2 - ny) * scaleY;
        // Where the centre should land in main's scrollable area:
        // svg's left edge inside main + content centre in svg.
        const svgLeftInMain = svgRect.left - mainRect.left + main.scrollLeft;
        const svgTopInMain = svgRect.top - mainRect.top + main.scrollTop;
        const targetX = svgLeftInMain + contentCx - mainRect.width / 2;
        const targetY = svgTopInMain + contentCy - mainRect.height / 2;
        if (targetX > 0) main.scrollLeft = targetX;
        if (targetY > 0) main.scrollTop = targetY;
      } catch (_) {}
    });
  }

  function applyState(state) {
    if (state.svg) {
      stage.innerHTML = state.svg;
      fitSvgToContent(stage.querySelector('svg'));
      stage.classList.remove('pulse');
      void stage.offsetWidth;
      stage.classList.add('pulse');
      // Re-apply highlight on the (just-replaced) element if narration
      // is currently playing; the previous highlight reference died with
      // the old DOM tree.  Same for the reveal mask: hide elements
      // gated by upcoming narration phrases on every re-render.
      activePhraseIndex = -1;
      applyRevealMask();
      tickHighlight();
      tickReveal();
    }
    if (state.revision !== undefined) revEl.textContent = state.revision;
    if (state.node_count !== undefined) nodesEl.textContent = state.node_count;
    if (state.edge_count !== undefined) edgesEl.textContent = state.edge_count;
    if (state.updated_at) {
      updatedEl.textContent = new Date(state.updated_at * 1000).toLocaleTimeString();
    }
    // ── Prelude → narration pipeline (all piper, one voice) ──────────
    // The prelude WAV is synthesised by piper server-side from
    // sevim_open(prelude=...).  The transition phrase is server-side
    // prepended to the narration WAV (Canvas.narrate prepends it from
    // self.transition_text), so the *same* voice speaks the transition
    // — no client-side chaining of separate utterances, no voice mismatch.
    if (state.has_intro) {
      const url = `/canvas/${cid}/intro.wav`;
      if (introLoaded !== url) {
        intro.src = `${url}?t=${Date.now()}`;
        intro.load();
        introLoaded = url;
        introPlayed = false;
      }
    }
    // (Was: tryPlayChain() here.)  Removed — audio only starts via
    // an explicit Play button click now.
    // Narration arrived (or was updated)?
    if (state.narration && state.narration.phrases &&
        state.narration.phrases.length > 0) {
      onNarrationReady(state.narration);
    }
  }

  function onNarrationReady(manifest) {
    const sameAsCurrent = (
      narration &&
      narration.phrases.length === manifest.phrases.length &&
      narration.duration_s === manifest.duration_s
    );
    narration = manifest;
    rebuildRevealMap(manifest);
    applyRevealMask();
    if (!sameAsCurrent) {
      // Cache-bust the audio src so the browser refetches when a new
      // narration is generated mid-session.
      audio.src = `/canvas/${cid}/narration.wav?t=${Date.now()}`;
      audio.load();
    }
    // The figure + narration are now FINAL — server has finished the
    // review loop, audio file is on disk.  Allow the Play button to
    // flip to READY once <audio>'s canplay fires (or immediately, if
    // it has already fired for this src).
    narrationManifestReady = true;
    maybeFlipReady();
    // Audio does NOT auto-play here.  Narration is loaded into the
    // <audio> element; the user clicks the header Play button to
    // start.  intro.ended still hands off to narration so that one
    // click on Play covers the full sequence.
  }

  // ── Narration-synced reveal ──────────────────────────────────────────
  // Build a map id → first start_s where this id is highlighted.  Any
  // element with a revealAt entry stays opacity:0 until its phrase
  // begins; everything else (axes, decorations, captions without a
  // matching phrase) is visible from the start.  This replaces the
  // fixed-0.4s SMIL stagger with audio-locked timing — the figure
  // builds itself in lockstep with the spoken explanation.
  let revealAt = {};   // id -> seconds
  let revealed = {};   // id -> true once the element has been shown

  function rebuildRevealMap(manifest) {
    revealAt = {};
    revealed = {};
    if (!manifest || !manifest.phrases) return;
    for (const p of manifest.phrases) {
      const id = p.highlight;
      if (id && !(id in revealAt)) {
        revealAt[id] = p.start_s;
      }
    }
  }

  function applyRevealMask() {
    // DISABLED — user feedback: figures should be fully visible from
    // the moment they render, not gated on audio playback.  Before
    // this change, every narration-highlighted element started at
    // opacity:0 and only faded in when its phrase began.  Users who
    // didn't press Play (or whose audio failed) saw a blank canvas
    // with "random missing matrices"; the screenshot-frozen snapshots
    // in chat ALSO came out blank because they captured opacity-0 SVG.
    // Narration emphasis still works via the highlight rect (the
    // colored .sevim-highlight stroke / fill), which doesn't depend
    // on opacity transitions.  Keep the function as a no-op so
    // callers don't break; tickReveal handles a separate code path
    // (it sets opacity 1, which is the default).
  }

  function tickReveal() {
    // Called every audio.timeupdate.  Walk the revealAt map and turn
    // on any element whose phrase has started.
    if (!narration) return;
    const t = audio.currentTime;
    for (const [id, start] of Object.entries(revealAt)) {
      if (revealed[id]) continue;
      if (t < start) continue;
      revealed[id] = true;
      const sel = `[data-nid="${cssEscape(id)}"], [data-eid="${cssEscape(id)}"], [id="${cssEscape(id)}"]`;
      stage.querySelectorAll(sel).forEach(el => {
        el.style.opacity = '1';
      });
    }
  }

  function clearHighlight() {
    stage.querySelectorAll('.sevim-highlight').forEach(el => {
      el.classList.remove('sevim-highlight');
    });
    // Substring highlighter creates ad-hoc <tspan class="sevim-substr"
    // sevim-highlight"> wrappers; tear them down by joining their
    // text content back into the parent <text> so the next phrase's
    // wrap operation starts from clean text.
    stage.querySelectorAll('tspan.sevim-substr').forEach(sp => {
      const parent = sp.parentNode;
      if (!parent) return;
      // Replace this tspan with a plain text node carrying the same
      // content; merge with adjacent text nodes afterwards.
      parent.replaceChild(
        document.createTextNode(sp.textContent), sp,
      );
      parent.normalize();
    });
  }

  // Map LaTeX-style subscript tokens (a_11, M_{1,2}) to the Unicode
  // form the model often emits in SVG text (a₁₁, M₁,₂).  Used by the
  // substring fallback so a narration highlight "a_11" can find
  // "a₁₁" in a rendered formula.
  const SUB_DIGITS = ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'];
  const SUP_DIGITS = ['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
  function toUnicodeSub(s) {
    return s.replace(/_\{([0-9,]+)\}|_([0-9]+)/g, (_, br, plain) =>
      [...(br || plain)].map(c =>
        c >= '0' && c <= '9' ? SUB_DIGITS[+c] : c,
      ).join('')
    );
  }
  function toUnicodeSup(s) {
    return s.replace(/\^\{([0-9]+)\}|\^([0-9])/g, (_, br, plain) =>
      [...(br || plain)].map(c =>
        c >= '0' && c <= '9' ? SUP_DIGITS[+c] : c,
      ).join('')
    );
  }

  // Wrap the FIRST occurrence of ``needle`` inside ``textEl`` in a
  // <tspan class="sevim-substr sevim-highlight">.  Walks every text
  // node child (skipping existing <tspan> that already have ids to
  // avoid breaking semantic structure) and finds the contiguous
  // match.  Returns true if a wrap happened.
  function wrapSubstringInText(textEl, needle) {
    if (!needle) return false;
    const NS = 'http://www.w3.org/2000/svg';
    // Only consider direct text-node children; mixed-content with
    // existing <tspan> structure isn't wrapped to avoid mangling
    // the model's intended subscript formatting.
    let textNode = null;
    for (const ch of textEl.childNodes) {
      if (ch.nodeType === 3 /* TEXT_NODE */) {
        if (ch.textContent.includes(needle)) {
          textNode = ch;
          break;
        }
      }
    }
    if (!textNode) {
      // Fallback: textEl has only one composite textContent; replace
      // its content with three children (before, tspan, after).
      const full = textEl.textContent;
      const i = full.indexOf(needle);
      if (i < 0 || textEl.children.length > 0) return false;
      textEl.textContent = '';
      if (i > 0) textEl.appendChild(document.createTextNode(full.slice(0, i)));
      const tsp = document.createElementNS(NS, 'tspan');
      tsp.setAttribute('class', 'sevim-substr sevim-highlight');
      tsp.textContent = needle;
      textEl.appendChild(tsp);
      if (i + needle.length < full.length) {
        textEl.appendChild(document.createTextNode(full.slice(i + needle.length)));
      }
      return true;
    }
    const text = textNode.textContent;
    const i = text.indexOf(needle);
    const before = text.slice(0, i);
    const after = text.slice(i + needle.length);
    const tsp = document.createElementNS(NS, 'tspan');
    tsp.setAttribute('class', 'sevim-substr sevim-highlight');
    tsp.textContent = needle;
    const parent = textNode.parentNode;
    if (before) parent.insertBefore(document.createTextNode(before), textNode);
    parent.insertBefore(tsp, textNode);
    if (after) parent.insertBefore(document.createTextNode(after), textNode);
    parent.removeChild(textNode);
    return true;
  }

  // Substring fallback: try the id verbatim and three normalised
  // variants (Unicode subscript, Unicode superscript, both).  Walk
  // every <text> in the stage and wrap the FIRST match in each.
  function highlightAllSubstringMatches(needle) {
    if (!needle) return false;
    const candidates = new Set([
      needle,
      toUnicodeSub(needle),
      toUnicodeSup(needle),
      toUnicodeSup(toUnicodeSub(needle)),
    ]);
    let any = false;
    const texts = stage.querySelectorAll('text');
    for (const t of texts) {
      // Skip if this text already lit up via id match — avoids
      // double-highlighting the same element.
      if (t.classList.contains('sevim-highlight')) continue;
      for (const c of candidates) {
        if (c && wrapSubstringInText(t, c)) {
          any = true;
          break;
        }
      }
    }
    return any;
  }

  function applyHighlight(target) {
    // ``target`` accepts either a single id (string) or a list of ids
    // (array of strings) so a single narration phrase can spotlight
    // multiple elements at once (e.g. "clause C1 contains x1 and ¬x2"
    // → highlight n_c1, n_x1, n_not_x2 simultaneously).
    clearHighlight();
    if (!target) return;
    const ids = Array.isArray(target) ? target : [target];
    for (const id of ids) {
      if (!id) continue;
      const sel = `[data-nid="${cssEscape(id)}"], [data-eid="${cssEscape(id)}"], [id="${cssEscape(id)}"]`;
      const elems = stage.querySelectorAll(sel);
      elems.forEach(el => el.classList.add('sevim-highlight'));
      // Character-level fallback: even when an id matched, ALSO
      // scan every <text> for substring occurrences of the id (or
      // its Unicode-normalised form).  The model frequently
      // highlights "a_11" but the text "a₁₁" appears in multiple
      // places (matrix cell + formula + caption); wrapping each
      // occurrence in a tspan lights them all up together so the
      // learner's eye lands on the same symbol no matter where it
      // lives in the figure.
      highlightAllSubstringMatches(id);
    }
  }

  function cssEscape(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return s.replace(/(["\\])/g, '\\$1');
  }

  function tickHighlight() {
    if (!narration || !narration.phrases) return;
    const t = audio.currentTime;
    let idx = -1;
    for (let i = 0; i < narration.phrases.length; i++) {
      const p = narration.phrases[i];
      if (t >= p.start_s && t < p.end_s) { idx = i; break; }
    }
    if (idx === activePhraseIndex) return;
    activePhraseIndex = idx;
    applyHighlight(idx >= 0 ? narration.phrases[idx].highlight : null);
  }

  // ── Word-level highlighting ────────────────────────────────────
  // OpenAI tts-1 doesn't expose per-word timestamps, so we estimate
  // them client-side: split each phrase's spoken text into words,
  // distribute the phrase duration evenly across them, then on each
  // audio timeupdate find the active word and underline its first
  // matching occurrence anywhere in the figure (including the
  // explanatory paragraph below the diagram).  This gives the
  // learner a karaoke-style read-along without requiring a TTS
  // upgrade.
  //
  // Tunable: WORD_MIN_LEN — words shorter than this aren't worth
  // highlighting (articles, "to", "is", etc.).  Keeps the focus on
  // content words.
  const WORD_MIN_LEN = 3;
  let _wordPhraseIdx = -1;
  let _wordIdx = -1;
  let _wordWrap = null;     // current <tspan class="sevim-word"> reference

  function _stripPunct(s) {
    return s.replace(/^[\s\W_]+|[\s\W_]+$/g, '');
  }

  function _phraseWords(phrase) {
    // Cache parsed word list on the phrase object so we don't
    // re-split every timeupdate.
    if (phrase._words) return phrase._words;
    const raw = (phrase.text || phrase.speak || '').split(/\s+/);
    const cleaned = raw.map(_stripPunct).filter(w => w.length >= WORD_MIN_LEN);
    phrase._words = cleaned;
    return cleaned;
  }

  function clearWordHighlight() {
    if (_wordWrap && _wordWrap.parentNode) {
      const parent = _wordWrap.parentNode;
      parent.replaceChild(
        document.createTextNode(_wordWrap.textContent), _wordWrap,
      );
      parent.normalize();
    }
    _wordWrap = null;
  }

  function highlightWord(word) {
    clearWordHighlight();
    if (!word) return;
    const NS = 'http://www.w3.org/2000/svg';
    // Scan every <text> for the first occurrence of the word.  Skip
    // text nodes that already live inside our own .sevim-word tspan
    // (paranoia after a torn-down highlight).
    const texts = stage.querySelectorAll('text');
    const lc = word.toLowerCase();
    for (const t of texts) {
      // Prefer direct-text-node match so we don't mangle existing
      // <tspan> structure (subscripts, baseline-shifts).
      for (const ch of t.childNodes) {
        if (ch.nodeType !== 3 /* TEXT_NODE */) continue;
        const txt = ch.textContent;
        // Find a whole-word match (preceded and followed by non-word
        // characters or string boundary).
        const re = new RegExp('(^|[^\\w])(' + word.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&') + ')(?![\\w])', 'i');
        const m = re.exec(txt);
        if (!m) continue;
        const start = m.index + m[1].length;
        const end = start + m[2].length;
        const before = txt.slice(0, start);
        const matched = txt.slice(start, end);
        const after = txt.slice(end);
        const tsp = document.createElementNS(NS, 'tspan');
        tsp.setAttribute('class', 'sevim-word');
        tsp.textContent = matched;
        const parent = ch.parentNode;
        if (before) parent.insertBefore(document.createTextNode(before), ch);
        parent.insertBefore(tsp, ch);
        if (after) parent.insertBefore(document.createTextNode(after), ch);
        parent.removeChild(ch);
        _wordWrap = tsp;
        return;
      }
    }
  }

  function tickWord() {
    if (!narration || !narration.phrases) return;
    const t = audio.currentTime;
    let pi = -1;
    for (let i = 0; i < narration.phrases.length; i++) {
      const p = narration.phrases[i];
      if (t >= p.start_s && t < p.end_s) { pi = i; break; }
    }
    if (pi < 0) {
      if (_wordWrap) clearWordHighlight();
      _wordPhraseIdx = -1; _wordIdx = -1;
      return;
    }
    const phrase = narration.phrases[pi];
    const words = _phraseWords(phrase);
    if (!words.length) {
      if (_wordWrap) clearWordHighlight();
      return;
    }
    const dur = Math.max(0.001, phrase.end_s - phrase.start_s);
    const frac = Math.min(1, Math.max(0, (t - phrase.start_s) / dur));
    const wi = Math.min(words.length - 1, Math.floor(frac * words.length));
    if (pi === _wordPhraseIdx && wi === _wordIdx) return;
    _wordPhraseIdx = pi;
    _wordIdx = wi;
    highlightWord(words[wi]);
  }

  // tickWord (the karaoke-style per-word highlighter) was a bad fit:
  // it linearly interpolated word indexes across the phrase duration
  // and substring-matched them anywhere in the figure, producing
  // visually "random" highlights (a₁₁ flashing while the narrator
  // says "is", "the", etc.).  Disabled; phrase-level highlight via
  // tickHighlight already targets the explicit highlight ids the
  // model returned, which is the right granularity.
  audio.addEventListener('timeupdate', () => {
    tickHighlight(); tickReveal();
  });
  audio.addEventListener('ended', () => {
    activePhraseIndex = -1;
    _wordPhraseIdx = -1; _wordIdx = -1;
    clearWordHighlight();
    clearHighlight();
  });

  // Manual play controls
  function userStart() {
    userInteracted = true;
    overlay.classList.add('hidden');
    // Unlock intro first if it hasn't played; narration's 'ended'
    // listener on intro will hand off to the main narration audio.
    if (intro.src && !introPlayed && intro.paused) {
      intro.play().catch(() => {});
      return;
    }
    audio.play().catch(err => console.error('audio play failed', err));
  }
  playBtn.addEventListener('click', userStart);
  overlayPlay.addEventListener('click', userStart);
  overlay.addEventListener('click', userStart);

  // Initial state load + SSE stream
  async function loadInitial() {
    if (!cid) return;
    try {
      const r = await fetch(`/canvas/${cid}/state`);
      if (r.ok) applyState(await r.json());
    } catch (e) { /* SSE will catch up */ }
  }

  function connectSSE() {
    if (!cid) return;
    const es = new EventSource(`/canvas/${cid}/events`);
    es.addEventListener('open', () => dot.className = 'dot live');
    es.addEventListener('error', () => dot.className = 'dot disconnected');
    es.addEventListener('render', (ev) => {
      try { applyState(JSON.parse(ev.data)); }
      catch (e) { console.error('bad SSE payload', e); }
    });
  }

  // ── Backend-side preferences (highlight color, audio speed/volume) ──
  // These are set by the chat pre-router when the user asks for a UI
  // change ('use red for highlight').  We poll on load and every few
  // seconds so changes from a sibling chat tab propagate to this view
  // without needing an SSE connection just for settings.
  async function applyPreferences() {
    try {
      const r = await fetch('/studio/preferences');
      if (!r.ok) return;
      const p = await r.json();
      if (p.highlight_color) {
        document.documentElement.style.setProperty('--highlight', p.highlight_color);
      }
      if (typeof p.audio_speed === 'number') {
        audio.playbackRate = p.audio_speed;
        intro.playbackRate = p.audio_speed;
      }
      if (typeof p.audio_volume === 'number') {
        audio.volume = p.audio_volume;
        intro.volume = p.audio_volume;
      }
    } catch (e) { /* preferences endpoint optional */ }
  }
  applyPreferences();
  setInterval(applyPreferences, 3000);

  // ── Interrupt path: parent (Studio chat) can pause audio on demand ───
  // When the user starts typing a new question or clicks the mic to
  // record speech, Studio posts {type: 'sevim_pause_audio'} so the
  // current narration shuts up immediately — otherwise the user is
  // typing/talking over a voice that's still explaining the old figure,
  // and the mic picks up the speakers.
  window.addEventListener('message', (ev) => {
    if (!ev.data || typeof ev.data !== 'object') return;
    if (ev.data.type === 'sevim_pause_audio') {
      if (!intro.paused) intro.pause();
      if (!audio.paused) audio.pause();
      clearHighlight();
      activePhraseIndex = -1;
    } else if (ev.data.type === 'sevim_partial_svg') {
      // Studio is streaming a new figure: the express LLM has emitted
      // enough SVG markup that we can paint the in-progress shape over
      // the prior one.  Partial markup is fine — unclosed elements just
      // don't render, and the next chunk re-replaces the whole stage.
      // We silence any narration that was still playing for the
      // previous figure since highlight IDs won't match the new SVG.
      const partial = ev.data.svg;
      if (typeof partial !== 'string' || !partial) return;
      if (!intro.paused) intro.pause();
      if (!audio.paused) audio.pause();
      clearHighlight();
      activePhraseIndex = -1;
      stage.innerHTML = partial;
      fitSvgToContent(stage.querySelector('svg'));
      stage.classList.remove('pulse');
      // While the figure is being (re-)drawn, the Play button cannot
      // safely fire — its audio is from the prior attempt and would
      // narrate a stale figure.  Switch to the disabled "Emerging…"
      // state until a fresh narration manifest arrives.
      narrationManifestReady = false;
      showPlayEmerging();
    }
  });

  loadInitial().then(connectSSE);
</script>
</body>
</html>
