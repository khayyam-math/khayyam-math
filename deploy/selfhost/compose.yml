# Khayyam Math — self-hosted stack.
#
# Replaces the AWS deployment (infra/sevim_stack.py) service-for-service
# on a single machine:
#
#   ECS Fargate task     → the `app` service below
#   RDS PostgreSQL       → the `db` service (named volume, nightly dump)
#   S3 canvas bucket     → the `canvases` volume (FileStorage backend)
#   Secrets Manager      → the gitignored .env next to this file
#   ALB + ACM + Route53  → the `caddy` service (Let's Encrypt + DNS A record)
#   EventBridge Scheduler→ systemd timers (see systemd/)
#
# The AWS stack is NOT deleted by any of this.  infra/ still deploys,
# and the mail layer keeps its SES backend, so reverting is a DNS
# change plus `cd infra && ./deploy.sh`.  See README.md.
#
# Usage:
#   cp env.example .env && $EDITOR .env      # fill in secrets
#   docker compose --env-file .env up -d --build
#   docker compose logs -f app

name: khayyam-math

services:
  # ── PostgreSQL — the RDS replacement ────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sevim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sevim}
      # Deterministic collation so index ordering matches the RDS dump.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only: pg_dump / psql from the host work, but the
    # database is never reachable from the LAN, let alone the internet.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sevim} -d ${POSTGRES_DB:-sevim}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    # Capped so a runaway query can't starve the app on a memory-tight
    # host.  The dataset is small; see POSTGRES_MEM_LIMIT in env.example.
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-1500m}

  # ── Application — the Fargate task replacement ──────────────────────
  app:
    build:
      # Repo root: the Dockerfile expects sevim/, service/, studio/,
      # mcp_server/ and infra/geolite/ in the build context.
      context: ../..
      dockerfile: Dockerfile
      args:
        SEVIM_GIT_SHA: ${SEVIM_GIT_SHA:-selfhost}
    # Explicit tag so redeploy.sh can keep a :rollback alias of the
    # previously-serving image and swap back without a rebuild — the
    # self-host equivalent of ECS's previous-task-definition rollback.
    image: khayyam-math-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # ── Storage ─────────────────────────────────────────────────────
      # No SEVIM_STORAGE_URL → service/storage.py picks FileStorage and
      # the canvases volume below is the system of record.  That is the
      # whole S3 replacement; the S3 backend stays in the code for a
      # revert.
      SEVIM_DATA_DIR: /var/sevim/canvases
      SEVIM_TELEMETRY_DB: postgresql://${POSTGRES_USER:-sevim}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sevim}

      # ── Behaviour parity with the AWS task definition ──────────────
      # Mirrors infra/sevim_stack.py env_vars.  Keep the two in sync so
      # a revert to Fargate is behaviourally identical.
      SEVIM_TELEMETRY: "1"
      SEVIM_RATE_LIMIT: "1"
      SEVIM_COST_GUARD: "1"
      SEVIM_COST_DAILY_MAX_USD: "10.00"
      SEVIM_CONTENT_FILTER: "1"

      # ── Anonymous access, defended per IP ──────────────────────────
      # This is where the self-hosted stack DIVERGES from AWS, which
      # keeps SEVIM_AUTH_REQUIRED=1.  Magic-link sign-in is off here, so
      # there is no mail dependency in the request path and visitors
      # reach the tutor with no wall.
      #
      # What sign-in was silently providing, and what replaces it:
      #
      #   * A ceiling on spend.  The cost guard is keyed on session_id,
      #     a localStorage UUID that a visitor can reset by clearing site
      #     data — decorative without auth.  SEVIM_COST_GUARD_BY_IP=1
      #     adds the same cap per IP, which costs real effort to rotate.
      #   * Distinct-people counts.  Telemetry now falls back to IP
      #     hashes: a school behind one NAT reads as one person, and one
      #     person on phone + laptop reads as two.  Anything quoting
      #     user counts from this deployment must say so.
      #
      # /studio/admin still needs a signed cookie, so it fails CLOSED
      # (404) rather than opening up.  Reaching it needs a magic link,
      # which needs SMTP configured — admin-only, not user-facing.
      SEVIM_AUTH_REQUIRED: "0"
      SEVIM_COST_GUARD_BY_IP: "1"
      # Anonymous means the IP bucket is the primary brake, so it is
      # tighter than the signed-in defaults (burst 10, 30/hr, 30/day).
      # Kept generous enough for a genuine lesson: a burst of 6 and 20
      # figures an hour is well past what one learner asks for, while a
      # scripted scrape hits it in a minute.  Raise if a classroom behind
      # one NAT reports being blocked — that is the expected false
      # positive of IP-keyed limits, and the reason auth existed.
      SEVIM_RATE_IP_CAPACITY: "6"
      SEVIM_RATE_IP_DAILY_MAX: "20"
      # Caddy puts the real client IP in the leftmost X-Forwarded-For
      # entry, exactly as the ALB and the Cloudflare Tunnel both did, so
      # studio/sessions.py:_client_ip() needs no change.
      SEVIM_TRUST_PROXY: "1"
      SEVIM_AUTH_DOMAIN: ${SEVIM_DOMAIN:-khayyammath.com}

      # ── Model configuration (hybrid GPT-5, 2026-06/2026-08) ────────
      # Keep in step with infra/sevim_stack.py, which carries the full
      # rationale.  Short version: the *-chat-latest line was shut down on
      # 2026-08-10, so the fast generation/review role is now the GPT-5.6
      # fast tier with reasoning switched off (5.7 s vs 13.5 s at low),
      # and reasoning is reserved for the final-retry auditor.
      SEVIM_VLLM_URL: "https://api.openai.com/v1"
      SEVIM_VLLM_MODEL: "gpt-5.6-luna"
      SEVIM_FORCE_ACTIVE_MODEL: "gpt-5.6-luna"
      SEVIM_REVIEW_MODE: "vision"
      SEVIM_REVIEW_MODEL: "gpt-5.6-luna"
      SEVIM_REVIEW_ESCALATE_MODEL: "gpt-5.5"
      SEVIM_GPT5_REASONING_EFFORT: "low"
      SEVIM_GPT5_NO_REASONING_MODELS: "gpt-5.6-luna"
      SEVIM_TTS_MODEL: "tts-1"

      # ── Taxonomy / answer cache ────────────────────────────────────
      SEVIM_ANSWER_CACHE: "1"
      SEVIM_ANSWER_CACHE_TAU: "0.93"
      SEVIM_TAXONOMY: "1"

      # AWS_REGION is deliberately ABSENT.  service/secrets.py treats it
      # as the "pull from Secrets Manager" switch; unset, it sources the
      # env file instead.  Setting it here would make every boot wait on
      # AWS API calls that are no longer authorised.
    volumes:
      - canvases:/var/sevim/canvases
    # Caddy reaches the app over the compose network, so this publish is
    # only for local smoke tests, redeploy.sh's health probe and the
    # systemd timers.  Loopback-bound: never exposed to the LAN, let
    # alone the internet.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    # Fargate ran 2 tasks × 3 GB after the 2026-06-08 OOM incident.
    # Workers here are the equivalent of tasks there: canvas state
    # rehydrates from Postgres, so they are interchangeable.  How many
    # you can afford is a function of host RAM — see SEVIM_WORKERS in
    # env.example.  The default is 1, sized for an 8 GB host.
    command:
      - uvicorn
      - service.app:app
      - --host=0.0.0.0
      - --port=8080
      - --workers=${SEVIM_WORKERS:-1}
      - --log-level=info
      - --access-log
      - --no-server-header
    deploy:
      resources:
        limits:
          memory: ${SEVIM_MEM_LIMIT:-5g}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Caddy — the ALB + ACM + Route 53 replacement ────────────────────
  # Terminates TLS on this box with a Let's Encrypt certificate it
  # obtains and renews by itself, and reverse-proxies to the app.  Point
  # an A record at the host and that is the whole edge.  See README.md §2.
  #
  # This replaced a Cloudflare Tunnel (2026-08-13).  The tunnel's real
  # value is reaching a host that CANNOT accept inbound connections —
  # behind CGNAT or a home router — which is not this host's situation:
  # it is a cloud VPS with a static public IP.  What the tunnel did cost
  # was an always-on daemon whose failure mode is "site unreachable", a
  # token that has to be obtained from a third party before the site can
  # serve at all, and two coupled switches (token + compose profile) that
  # redeploy.sh had to police because half-configuring them fails
  # silently.  Caddy needs no credential from anyone.
  #
  # What you give up: Cloudflare was absorbing DDoS and hiding the origin
  # IP.  If you want that back without the daemon, put Cloudflare in
  # front as PROXIED DNS pointing at this IP and restrict ufw to
  # Cloudflare's ranges — Caddy stays exactly as it is.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    # The only ports open to the internet on this host, besides SSH.
    # 443/udp carries HTTP/3; harmless to publish if unused.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SEVIM_DOMAIN: ${SEVIM_DOMAIN:-khayyammath.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys live here.  This volume is NOT
      # optional: lose it and every restart re-issues from scratch, which
      # walks straight into Let's Encrypt's rate limit (5 duplicate certs
      # per week) and leaves the site without TLS until it resets.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  canvases:
  caddy_data:
  caddy_config:
