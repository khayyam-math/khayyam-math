[project]
name = "sevim"
version = "0.3.0"
description = "Figure runtime: structured spec → live canvas + audio narration. MCP server + Studio web app driven by tool-using LLMs (Claude, GPT-4o, Gemini, local Qwen via vLLM)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mcp>=1.0",
    "sse-starlette>=2.0",
    "cairosvg>=2.7",
    "piper-tts>=1.2",
    "httpx>=0.27",
    # CP-SAT solver for the deterministic label-placement planner
    # (studio/layout_planner.py).  Pinned >=9.10 to match local dev;
    # the planner fails open if the import fails so an older
    # container won't crash, but production needs it for the
    # global-optimum guarantee on figure layouts.
    "ortools>=9.10",
    "matplotlib>=3.8",
    # Plotly + Kaleido render high-quality 2-D plots and 3-D surfaces
    # (studio/templates/plotly_render.py).  Kaleido exports static
    # images via headless Chrome — the container already installs
    # `chromium`.  If Kaleido can't find Chrome the renderer fails
    # gracefully and the matplotlib renderer takes over.
    "plotly>=6.0",
    "kaleido>=1.0",
    # SymPy: exact symbolic math (derivatives, Hessians, integrals)
    # so the figure pipeline never relies on the LLM for arithmetic.
    "sympy>=1.13",
    # Z3: SMT solver used as a second-tier check when SymPy can't
    # decide an identity (especially nonlinear arithmetic and
    # quantified statements).  Lightweight (~10 MB) Python bindings.
    "z3-solver>=4.13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
aws = ["boto3>=1.34", "psycopg[binary]>=3.1"]

[project.scripts]
sevim-mcp = "mcp_server.__main__:main"
sevim-studio = "studio.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sevim*", "service*", "mcp_server*", "studio*"]
