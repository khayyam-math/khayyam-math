[project]
name = "khayyam-math"
version = "0.4.1"
description = "Khayyam Math — visualized math teaching. Public Python API (KhayyamMath client with OpenAI / fine-tuned Qwen / vLLM providers) plus the production figure runtime: structured spec → live canvas + audio narration, MCP server, and Studio web app."
requires-python = ">=3.10"
dependencies = [
    # ─── Public-package essentials ────────────────────────────────
    # OpenAI SDK powers both the openai and qwen-vllm providers (vLLM
    # speaks the OpenAI-compatible REST API).  Lightweight (~5 MB).
    "openai>=1.30",
    # huggingface_hub is used by the qwen provider to resolve the
    # adapter config so callers only need one repo id, and is also
    # used by the model-card uploader.  Already a transitive dep of
    # most ML tools; declaring it explicitly is cheap.
    "huggingface_hub>=0.24",
    # ─── Production studio + MCP server ───────────────────────────
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mcp>=1.0",
    "sse-starlette>=2.0",
    "cairosvg>=2.7",
    "piper-tts>=1.2",
    "httpx>=0.27",
    # CP-SAT solver for the deterministic label-placement planner
    # (studio/layout_planner.py).  Pinned >=9.10 to match local dev;
    # the planner fails open if the import fails so an older
    # container won't crash, but production needs it for the
    # global-optimum guarantee on figure layouts.
    "ortools>=9.10",
    "matplotlib>=3.8",
    # Plotly + Kaleido render high-quality 2-D plots and 3-D surfaces
    # (studio/templates/plotly_render.py).  Kaleido exports static
    # images via headless Chrome — the container already installs
    # `chromium`.  If Kaleido can't find Chrome the renderer fails
    # gracefully and the matplotlib renderer takes over.
    "plotly>=6.0",
    "kaleido>=1.0",
    # SymPy: exact symbolic math (derivatives, Hessians, integrals)
    # so the figure pipeline never relies on the LLM for arithmetic.
    "sympy>=1.13",
    # Z3: SMT solver used as a second-tier check when SymPy can't
    # decide an identity (especially nonlinear arithmetic and
    # quantified statements).  Lightweight (~10 MB) Python bindings.
    "z3-solver>=4.13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
aws = ["boto3>=1.34", "psycopg[binary]>=3.1", "geoip2>=4.8"]
# Local Qwen back-end — pulls torch + transformers + peft + accelerate.
# Heavy (~5 GB once installed) so it stays opt-in:  pip install
# khayyam-math[qwen].  Without this extra, only the openai and
# qwen-vllm providers work.
qwen = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.30",
    "safetensors>=0.4",
]

[project.scripts]
sevim-mcp = "mcp_server.__main__:main"
sevim-studio = "studio.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["khayyam_math*", "sevim*", "service*", "mcp_server*", "studio*"]

[tool.pytest.ini_options]
# --strict-markers turns an unknown mark into a hard error instead of a
# silent no-op.  This catches typos (intgeration vs integration) and
# forces every new custom mark to be declared here before use.
addopts = "--strict-markers"
markers = [
    "integration: requires live API credentials (OPENAI_API_KEY); excluded from fork PR CI with -m 'not integration'",
]
