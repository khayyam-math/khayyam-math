[project]
name = "sevim"
version = "0.2.0"
description = "Semantic-graph + deterministic layout + minimal shape grammar → SVG whiteboard, with MCP server for LLM hosts (Claude, ChatGPT, Gemini)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mcp>=1.0",
    "sse-starlette>=2.0",
    "cairosvg>=2.7",
    "piper-tts>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
embed = ["sentence-transformers>=2.3", "torch>=2"]

[project.scripts]
sevim = "sevim.cli:main"
sevim-mcp = "mcp_server.__main__:main"
sevim-studio = "studio.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sevim*", "service*", "mcp_server*", "studio*"]
