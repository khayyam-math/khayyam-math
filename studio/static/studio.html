<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
<title>Khayyam Math — visual tutor</title>
<!-- KaTeX renders inline math in the theory primer that streams into the
     assistant message before the figure is ready.  The auto-render
     extension scans the message DOM for $...$ and $$...$$ delimiters
     and replaces them with rendered math nodes; we run it manually
     after each chunk arrives so partial LaTeX doesn't render until
     the closing delimiter is in. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #fafafa; --fg: #222; --muted: #777; --accent: #2a6df4;
    --border: #e0e0e0; --user-bg: #eef3ff; --asst-bg: #f4f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a1a; --fg: #eee; --muted: #999;
            --border: #333; --user-bg: #1e2a47; --asst-bg: #222428; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  /* Removed the fixed body height + overscroll lock so the canvas
     pane can grow taller than the viewport when a figure has a lot
     of detail.  Page-level vertical scroll is now the natural way
     to see the whole canvas; the chat input row stays accessible
     because we no longer force everything into a single viewport. */
  body { min-height: 100dvh; }
  .layout { display: grid; grid-template-columns: 400px 1fr; min-height: 100dvh; }
  .chat { border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat-header { padding: 0.75em 1em; border-bottom: 1px solid var(--border);
    font-size: 0.9em; display: flex; gap: 0.6em; align-items: center; }
  .chat-header .title { font-weight: 600; letter-spacing: -0.01em; }
  .chat-header .status { color: var(--muted); font-size: 0.78em; margin-left: auto;
    /* Status text is informational only — don't let a long model name
       push the clear button off-screen on narrow widths. */
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 12em;
    display: inline-flex; align-items: center; gap: 0.4em; }
  /* Replace the heavy bullet that the JS prepends to "ready" with a
     small green LED — looks like a status light, not a chunky character. */
  .chat-header .status::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 6px rgba(34,197,94,0.55);
  }
  .chat-header .status.error::before { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.6); }
  .chat-header .status.error { color: #ef4444; }
  /* When the JS hasn't filled status yet, hide the dot to avoid a
     mysterious empty green bullet during boot. */
  .chat-header .status:empty::before { display: none; }
  .chat-header #canvas-badge { font-size: 0.7em; color: var(--muted);
    font-family: ui-monospace, monospace; }
  .chat-header #clear-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 4px; padding: 0.25em 0.55em;
    font-size: 0.78em; cursor: pointer;
  }
  .chat-header #clear-btn:hover { color: var(--fg); border-color: var(--accent); }
  .chat-log { flex: 1; overflow-y: auto; padding: 0.6em 0.8em;
    display: flex; flex-direction: column; gap: 0.6em;
    -webkit-overflow-scrolling: touch; }
  .msg { padding: 0.6em 0.8em; border-radius: 8px; line-height: 1.4;
    font-size: 0.95em; max-width: 95%; word-wrap: break-word;
    overflow-wrap: anywhere; }
  .msg.user { background: var(--user-bg); align-self: flex-end; }
  .msg.asst { background: var(--asst-bg); align-self: flex-start; }
  /* Theory primer: same alignment as assistant, slightly accented border
     so the learner can tell at a glance which line is the primer vs the
     final "Done — see the canvas" line.  KaTeX renders inside. */
  .msg.primer { border-left: 3px solid var(--accent); }
  .msg.primer .katex { font-size: 1.02em; }
  .msg.tool { background: transparent; color: var(--muted); font-size: 0.8em;
    font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .input-row { display: flex; gap: 0.4em; padding: 0.6em;
    /* iOS notch / home-indicator padding so the send button isn't
       hidden under the bottom bezel when added to the home screen. */
    padding-bottom: max(0.6em, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); }
  .input-row textarea { flex: 1; resize: none; padding: 0.5em;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg);
    /* Explicit 16px font on the input prevents iOS Safari from auto-
       zooming the page when the user taps to type — anything smaller
       triggers the zoom. */
    font-size: 16px;
    line-height: 1.35;
    font-family: inherit;
    min-height: 2.6em; max-height: 8em; }
  .input-row button {
    padding: 0 0.9em;
    border: none; border-radius: 6px; cursor: pointer;
    background: var(--accent); color: white; font: inherit;
    /* WCAG-aligned touch target — buttons under 44px are hard to tap
       reliably on a phone. */
    min-height: 44px; min-width: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 120ms ease, opacity 120ms ease;
  }
  .input-row button:hover:not(:disabled) { filter: brightness(1.05); }
  .input-row button:disabled { opacity: 0.5; cursor: default; }
  .input-row #send-btn.loading {
    /* When a turn is in flight, swap the icon for a spinning ring so
       the user gets feedback the request is moving — beyond just the
       button being disabled. */
    background: var(--accent); position: relative;
  }
  .input-row #send-btn.loading svg { display: none; }
  .input-row #send-btn.loading::after {
    content: ""; width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .input-row button.mic { background: transparent; color: var(--accent);
    border: 1px solid var(--accent); }
  .input-row button.mic.recording {
    background: #ef4444; border-color: #ef4444; color: white;
    animation: pulse-mic 0.9s infinite;
  }
  @keyframes pulse-mic {
    0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    50%     { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
  }
  .canvas-pane { display: flex; flex-direction: column; min-height: 0; }
  .canvas-pane iframe { flex: 1; border: 0; width: 100%; }
  /* Empty state: branded title + tagline + tappable example prompts.
     Replaces the bare "Ask a question…" italic line that left the
     canvas-pane feeling unowned and offered no scaffolding for a new
     user who doesn't know what Sevim can draw. */
  .placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; color: var(--muted);
    text-align: center; padding: 1.5em;
    gap: 0.8em;
  }
  .placeholder .empty-brand {
    font-size: 1.8em; font-weight: 700; color: var(--fg);
    letter-spacing: -0.02em;
  }
  .placeholder .empty-tagline {
    font-size: 0.95em; color: var(--muted); max-width: 28em;
    line-height: 1.45;
  }
  .placeholder .empty-examples {
    display: flex; flex-wrap: wrap; gap: 0.5em; justify-content: center;
    margin-top: 0.6em; max-width: 36em;
  }
  .placeholder .example-chip {
    background: var(--asst-bg); color: var(--fg); border: 1px solid var(--border);
    padding: 0.55em 0.9em; border-radius: 999px;
    font: inherit; font-size: 0.85em; cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
    min-height: 40px;
  }
  .placeholder .example-chip:hover { border-color: var(--accent); }
  .placeholder .example-chip:active { background: var(--user-bg); }
  /* Mobile chat-log welcome card (see #chat-empty in markup).  Hidden
     on desktop because the canvas-pane already shows this content;
     hidden once any message exists in the log. */
  .chat-empty {
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 0.7em; padding: 1.5em 1em;
    color: var(--muted); margin: auto 0;
  }
  .chat-empty .empty-brand {
    font-size: 1.4em; font-weight: 700; color: var(--fg);
    letter-spacing: -0.02em;
  }
  .chat-empty .empty-tagline { font-size: 0.9em; line-height: 1.45; max-width: 22em; }
  .chat-empty .empty-examples {
    display: flex; flex-wrap: wrap; gap: 0.45em; justify-content: center;
    margin-top: 0.4em;
  }
  .chat-empty .example-chip {
    background: var(--asst-bg); color: var(--fg); border: 1px solid var(--border);
    padding: 0.5em 0.85em; border-radius: 999px;
    font: inherit; font-size: 0.82em; cursor: pointer; min-height: 40px;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .chat-empty .example-chip:hover { border-color: var(--accent); }
  .chat-empty .example-chip:active { background: var(--user-bg); }
  /* Container needs flex layout so the welcome card vertically centers. */
  .chat-log { display: flex; flex-direction: column; }
  /* Show the chat empty-state only on mobile, only when no other
     children exist in chat-log (i.e. no messages yet). */
  @media (max-width: 900px) {
    .chat-log:has(.chat-empty:first-child:last-child) { justify-content: center; }
    body:not(.has-canvas) .chat-empty { display: flex; }
  }
  /* The clear button + canvas badge inherit chat-header sizing; force
     them to be tappable on touch. */
  .chat-header button, .chat-header [type=button] {
    min-height: 32px; min-width: 32px;
  }
  /* Stack into a single column on phones AND iPad-portrait.  The
     canvas-pane gets the top ~38vh, the chat takes the rest with the
     input pinned to the bottom.  900px lets us cover iPad Mini portrait
     (768×1024) and iPad Pro 11" portrait (834×1194) — both feel cramped
     when the chat column eats half the width side-by-side.  Desktop
     side-by-side kicks in at ≥901px. */
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
      /* `auto 1fr` lets the canvas-pane grow to whatever height the
         figure needs (driven by the iframe's aspect-ratio rule below)
         instead of being clipped to 38vh.  Detailed figures stay
         readable; the page scrolls vertically when the canvas plus
         the chat exceed one viewport, which is the natural behaviour
         for a long-form answer. */
      grid-template-rows: auto 1fr;
    }
    .canvas-pane {
      order: -1;
      border-bottom: 1px solid var(--border);
      /* Cap at viewport-height when the figure has a tall aspect
         ratio so the chat input stays reachable.  The user can
         still scroll WITHIN the canvas iframe (overflow:auto on
         <main>) to see the rest. */
      max-height: 70vh;
    }
    /* Iframe takes the natural aspect of the SVG viewBox (900x650
       by default).  Width matches the pane; height follows.  No
       more cropping a 4x4 matrix into 280px of vertical space. */
    .canvas-pane iframe {
      width: 100%; height: auto;
      aspect-ratio: 900 / 650;
      max-height: 70vh;
    }
    /* Initial state (no canvas yet) — collapse the canvas-pane to a
       small banner so the chat takes the whole viewport.  Users land
       on a familiar chat layout where the input is reachable without
       scrolling and the example prompts (rendered inside the chat
       log on mobile, see below) are immediately visible.  Once a
       canvas exists, body.has-canvas flips the grid back to the
       38vh/1fr split. */
    body:not(.has-canvas) .layout {
      /* Single full-height row so the chat fills the screen.  We
         CAN'T just `grid-template-rows: 0 1fr` with `display:none` on
         the canvas-pane — the chat (order:-1 ahead of it) lands in
         the 0-height first track because display:none removes the
         pane from the grid entirely.  A single-row template puts
         the chat in the only slot. */
      grid-template-rows: 1fr;
    }
    body:not(.has-canvas) .canvas-pane {
      display: none;
    }
    .chat { border-right: none; }
    .chat-header {
      padding: 0.55em 0.8em;
      gap: 0.5em;
      font-size: 0.9em;
    }
    .chat-header .status { font-size: 0.7em; max-width: 8em; }
    /* Hide the developer-oriented canvas_id badge on mobile — it
       eats ~140px of header width and adds zero learner value.
       Power users can still see it on desktop / on the standalone
       /canvas/<id>/view page. */
    .chat-header #canvas-badge { display: none; }
    /* One-shot pulse when a new figure arrives: outline the canvas
       pane in the accent colour for ~700ms so the learner notices
       the figure even if they're reading the primer below.  The
       class is added by sendMessage's tool_result handler and
       auto-removed on animationend. */
    .canvas-pane.figure-arrived {
      animation: figureArrive 700ms ease-out;
    }
    @keyframes figureArrive {
      0%   { box-shadow: inset 0 0 0 3px var(--accent); }
      70%  { box-shadow: inset 0 0 0 3px var(--accent); }
      100% { box-shadow: inset 0 0 0 0px var(--accent); }
    }
    .chat-log { padding: 0.5em 0.6em; }
    .msg { font-size: 1em; max-width: 92%; }
    .msg.tool { font-size: 0.78em; }
    .input-row { padding: 0.5em; gap: 0.35em; }
    .input-row button { padding: 0 0.7em; }
    .placeholder { gap: 0.55em; padding: 0.8em; }
    .placeholder .empty-brand { font-size: 1.4em; }
    .placeholder .empty-tagline { font-size: 0.85em; }
    .placeholder .example-chip { font-size: 0.78em; padding: 0.45em 0.75em; }
  }
  /* Landscape phones — keep side-by-side but with a tighter chat
     column so neither pane is starved. */
  @media (min-width: 600px) and (max-width: 900px) and (orientation: landscape) {
    .layout {
      grid-template-columns: 280px 1fr;
      grid-template-rows: none;
    }
    .canvas-pane { order: 0; border-bottom: none; }
    .chat { border-right: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="chat">
    <div class="chat-header">
      <span class="title">Khayyam Math</span>
      <span class="status" id="status" aria-live="polite"></span>
      <span id="canvas-badge"></span>
      <button id="clear-btn" type="button" title="Clear conversation"
              aria-label="Clear conversation">clear</button>
    </div>
    <div class="chat-log" id="log">
      <!-- Mobile-only welcome card.  On desktop the canvas-pane shows
           the same content (see #placeholder below); on mobile that
           pane is collapsed until a figure exists, so the welcome
           lives here where the user is already looking.  Removed by
           sendMessage() as soon as the first turn is committed. -->
      <div class="chat-empty" id="chat-empty">
        <div class="empty-brand">Khayyam Math</div>
        <div class="empty-tagline">A live diagram tutor — ask in words, watch a figure appear.</div>
        <div class="empty-examples" role="group" aria-label="Example prompts">
          <button type="button" class="example-chip" data-prompt="Show how the angles of a triangle sum to π">Triangle angle sum</button>
          <button type="button" class="example-chip" data-prompt="Draw the unit circle with sin and cos labelled at 30°, 45°, 60°">Unit circle (sin / cos)</button>
          <button type="button" class="example-chip" data-prompt="Illustrate matrix multiplication with two 3×3 matrices and a worked cell">Matrix multiplication</button>
          <button type="button" class="example-chip" data-prompt="Show the area under y = x² from 0 to 2 as a Riemann sum, then the integral">Area under x²</button>
        </div>
      </div>
    </div>
    <div class="input-row">
      <button class="mic" id="mic-btn" type="button"
              title="Voice input" aria-label="Voice input">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path fill="currentColor" d="M19 11h-1a6 6 0 0 1-12 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/>
        </svg>
      </button>
      <textarea id="input" placeholder="Describe a figure…"
                rows="1" autocapitalize="sentences"></textarea>
      <button id="send-btn" type="button" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M3 11.5L21 3l-8.5 18-2-7.5z"/>
        </svg>
      </button>
    </div>
  </aside>
  <main class="canvas-pane">
    <div class="placeholder" id="placeholder">
      <div class="empty-brand">Khayyam Math</div>
      <div class="empty-tagline">A live diagram tutor — ask in words, watch a figure appear.</div>
      <div class="empty-examples" role="group" aria-label="Example prompts">
        <button type="button" class="example-chip" data-prompt="Show how the angles of a triangle sum to π">Triangle angle sum</button>
        <button type="button" class="example-chip" data-prompt="Draw the unit circle with sin and cos labelled at 30°, 45°, 60°">Unit circle (sin / cos)</button>
        <button type="button" class="example-chip" data-prompt="Illustrate matrix multiplication with two 3×3 matrices and a worked cell">Matrix multiplication</button>
        <button type="button" class="example-chip" data-prompt="Show the area under y = x² from 0 to 2 as a Riemann sum, then the integral">Area under x²</button>
      </div>
    </div>
    <iframe id="canvas-frame" style="display:none" title="Khayyam Math canvas"></iframe>
  </main>
</div>
<script>
  // ── State (in-memory only; reload starts fresh) ──
  // localStorage persistence was removed: each page load should give a
  // clean conversation and a clean canvas slot, so the user never gets
  // an old figure replayed silently.
  let canvasId = null;

  // ── Canvas-restore on visibility change ─────────────────────────
  // iOS Safari (and any tab the OS decides to swap out) frequently
  // discards the <iframe>'s loaded document while keeping the rest
  // of the page alive — when the user comes back the iframe is
  // visible but empty.  We close that gap by re-loading the canvas
  // whenever the document becomes visible AND we still remember
  // its canvas_id but the iframe doesn't have it loaded.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (!canvasId) return;
    const expected = '/canvas/' + canvasId + '/view';
    try {
      const cur = (frame && frame.src) || '';
      if (cur.indexOf(expected) < 0 || cur.endsWith('about:blank')) {
        frame.src = expected;
      }
      frame.style.display = 'block';
      const ph = document.getElementById('placeholder');
      if (ph) ph.style.display = 'none';
      document.body.classList.add('has-canvas');
    } catch (_) { /* iframe not ready yet */ }
  });
  let history = [];           // [{role, content}, ...]
  // Canvas IDs the user has pinned with the 📌 button on prior asst
  // messages.  Sent to Studio with each new prompt so gpt-4o sees the
  // pinned figures' PNG snapshots as conversational context.
  let pinnedCanvasIds = [];
  // Stable per-tab session id, persisted in localStorage so refreshes
  // keep the same identity (telemetry / rate-limit grouping).
  function _genSessionId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
  let sessionId = (() => {
    try {
      const k = 'sevim_session_id_v1';
      let s = localStorage.getItem(k);
      if (!s) { s = _genSessionId(); localStorage.setItem(k, s); }
      return s;
    } catch (_) {
      return _genSessionId();
    }
  })();
  function persistHistory() { /* no-op: memory removed */ }
  function clearPersistedState() {
    // Best-effort wipe of any leftover state from older builds that
    // did persist to localStorage.
    try { localStorage.removeItem('sevim_studio_state_v1'); } catch (e) {}
  }

  // Element refs first — these are the ones the click handlers need.
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn = document.getElementById('mic-btn');
  const frame = document.getElementById('canvas-frame');
  const placeholder = document.getElementById('placeholder');
  const canvasBadge = document.getElementById('canvas-badge');
  const clearBtn = document.getElementById('clear-btn');

  // Best-effort: wipe any leftover localStorage from older builds.
  // Each page load starts with an empty conversation and an empty
  // canvas slot — no replay of prior figures.
  clearPersistedState();

  clearBtn.addEventListener('click', () => {
    if (!confirm('Clear conversation?')) return;
    history = [];
    canvasId = null;
    log.innerHTML = '';
    placeholder.style.display = 'flex';
    frame.style.display = 'none';
    frame.src = 'about:blank';
    clearPersistedState();
  });

  // ── Health check ─────────────────────────────────────────────────────
  // The user doesn't care which model is configured — they care
  // whether Sevim is *up*.  Show a green bullet on success, the
  // specific failure mode on error.  Hover/title carries the model
  // name for power users + future debugging.
  fetch('/studio/health').then(r => r.json()).then(h => {
    let label = '', errored = false, title = '';
    if (h.backend === 'vllm') {
      const tag = h.remote === 'openai' ? 'openai' : 'local';
      title = h.model + ' · ' + tag;
      if (!h.vllm_reachable) {
        label = tag === 'openai' ? 'openai unreachable' : 'vllm unreachable';
        errored = true;
      } else if (tag === 'openai' && !h.api_key_configured) {
        label = 'no OPENAI_API_KEY';
        errored = true;
      } else {
        label = 'ready';
      }
    } else if (!h.api_key_configured) {
      label = 'no API key';
      errored = true;
    } else {
      label = 'ready';
      title = h.model || '';
    }
    status.textContent = label;
    status.title = title;
    if (errored) status.classList.add('error');
  }).catch(() => {
    status.textContent = 'offline';
    status.classList.add('error');
  });

  // ── Example-prompt chips on the empty state ─────────────────────────
  // Tapping one drops the prompt into the textarea and immediately
  // sends it — feels like a launchpad rather than make-the-user-type.
  document.querySelectorAll('.example-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const prompt = chip.dataset.prompt;
      if (!prompt) return;
      input.value = prompt;
      sendMessage();
    });
  });

  // ── Logging utilities ────────────────────────────────────────────────
  function appendMsg(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // ── Interrupt path: stop any narration playing in the canvas iframe ──
  // Called whenever the user starts a new turn (typing, recording, or
  // sending) so the old voice doesn't talk over them and the mic doesn't
  // pick up the speakers.  Idempotent — the iframe ignores the message
  // if audio is already paused.
  function interruptNarration() {
    try {
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({type: 'sevim_pause_audio'}, '*');
      }
    } catch (_) { /* cross-origin or not loaded yet */ }
    // Also stop the browser TTS speaking the primer.
    try { window.speechSynthesis.cancel(); } catch (_) {}
    primerSpeaking = false;
    primerEnded = false;
  }

  // ── Theory-primer state ──────────────────────────────────────────────
  // The server streams a primer SSE event named primer_chunk containing
  // a raw delta of text (LaTeX inline math via $...$ / $$...$$).  We
  // accumulate the deltas in a dedicated DOM node, render LaTeX with
  // KaTeX, and speak each sentence as it completes so the learner hears
  // the theoretical setup while the figure is still rendering.
  //
  // Coordination with the canvas iframe: the iframe normally auto-plays
  // its narration WAV on load, but we don't want it talking over our
  // primer.  When primer_chunk arrives, we set primerSpeaking=true; the
  // svg_chunk + tool_result handlers below post {sevim_pause_audio} to
  // the iframe so its narration stays silent.  When primer TTS ends
  // (utterance.onend or primer_done event), we post sevim_resume_audio
  // so the iframe picks up its narration cleanly.
  let primerEl = null;            // <div class="msg primer">
  let primerRaw = '';             // accumulated raw text (deltas joined)
  let primerSpokenUpto = 0;       // index up to which we've queued TTS
  let primerSpeaking = false;     // any utterance currently scheduled
  let primerEnded = false;        // primer_done received from server

  function ensurePrimerEl(beforeEl) {
    if (primerEl) return primerEl;
    primerEl = document.createElement('div');
    primerEl.className = 'msg asst primer';
    // ``beforeEl`` is the assistant bubble for the current turn — we
    // insert the primer *before* it so the chat reads top-to-bottom:
    // user prompt → primer → final assistant note → canvas.
    if (beforeEl && beforeEl.parentNode === log) {
      log.insertBefore(primerEl, beforeEl);
    } else {
      log.appendChild(primerEl);
    }
    log.scrollTop = log.scrollHeight;
    return primerEl;
  }

  function renderPrimerMath() {
    if (!primerEl || !window.renderMathInElement) return;
    try {
      window.renderMathInElement(primerEl, {
        // Cover the four common LaTeX delimiter styles.  The primer
        // model was tutored on `$..$` / `$$..$$`, but in practice it
        // also reaches for `\(..\)` and `\[..\]` (those are the
        // OpenAI assistant defaults), so KaTeX must match all four —
        // otherwise the literal backslash form leaks through to the
        // user as raw source.
        delimiters: [
          { left: '$$',  right: '$$',  display: true  },
          { left: '\\[', right: '\\]', display: true  },
          { left: '$',   right: '$',   display: false },
          { left: '\\(', right: '\\)', display: false },
        ],
        throwOnError: false,
        // Don't try to render inside our own already-styled spans
        // (avoids re-rendering KaTeX output on subsequent chunks).
        ignoredClasses: ['katex-html', 'katex'],
      });
    } catch (_) { /* partial LaTeX, ignore */ }
  }

  // Speak whatever sentence boundary we've passed since last speak.
  // We never split mid-sentence — KaTeX delimiters could land inside a
  // sentence and we don't want speech and rendering to fight over
  // partial text.  When primer_done lands and there's residual text,
  // we flush whatever remains.
  //
  // 2026-05-12: This function used to drive browser SpeechSynthesis to
  // narrate the primer as it streamed.  The result was unreliable —
  // every OS / browser ships a different voice, Linux & Android voices
  // butchered math notation ("nonsense speech at the beginning" was
  // the actual user complaint), and the primer voice frequently
  // overlapped with the figure narration WAV when the user pressed
  // Play.  The figure narration is high-quality OpenAI tts-1; that's
  // what speaks.  The primer is now a TEXT-ONLY explanation in the
  // chat panel, KaTeX-rendered for math.
  function speakPrimerProgress(_flush) {
    // No-op kept so existing call sites don't need to change; remove
    // entirely once we're confident the silent primer is right.
    return;
  }

  // ── Voice input via Web Speech API ───────────────────────────────────
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null, recording = false;
  if (SpeechRec) {
    recog = new SpeechRec();
    recog.continuous = false;
    recog.interimResults = true;
    recog.lang = 'en-US';
    recog.onresult = (ev) => {
      let txt = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        txt += ev.results[i][0].transcript;
      }
      input.value = txt;
    };
    recog.onend = () => {
      recording = false;
      micBtn.classList.remove('recording');
      // Auto-send if there's text
      if (input.value.trim()) sendMessage();
    };
    recog.onerror = (e) => {
      console.warn('SpeechRecognition error', e);
      recording = false;
      micBtn.classList.remove('recording');
    };
  } else {
    micBtn.disabled = true;
    micBtn.title = 'Voice input not supported in this browser';
  }
  micBtn.addEventListener('click', () => {
    if (!recog) return;
    if (recording) { recog.stop(); return; }
    // Kill the canvas's narration audio BEFORE we open the mic — otherwise
    // the speakers feed straight back into the recording.
    interruptNarration();
    recog.start();
    recording = true;
    micBtn.classList.add('recording');
  });

  // ── Voice output ─────────────────────────────────────────────────────
  // No chat-side Web Speech.  All audio comes from the canvas iframe:
  // the piper-synthesised prelude (sevim_open's prelude=…) plays first,
  // then the transition phrase, then the phrase-timed narration WAV
  // with highlights — one consistent voice, one timeline.  Speaking
  // the assistant's chat reply *and* the canvas prelude in parallel
  // sounded like two people talking over each other; this is the fix.

  // ── Send loop ────────────────────────────────────────────────────────
  async function sendMessage() {
    const user = input.value.trim();
    if (!user) return;
    // Pause any in-flight narration the moment the user commits a new
    // turn — otherwise the old explanation keeps talking over the new
    // one being generated.
    interruptNarration();
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    sendBtn.classList.add('loading');
    // First turn — remove the mobile welcome card so the chat starts
    // from a clean log.  Idempotent: removing a non-child is a no-op.
    const chatEmpty = document.getElementById('chat-empty');
    if (chatEmpty && chatEmpty.parentNode) chatEmpty.remove();
    appendMsg('user', user);

    const asstEl = appendMsg('asst', '…');
    asstEl.style.opacity = '0.5';
    let asstText = '';
    // Reset primer state for this turn — a fresh primer node is created
    // the first time primer_chunk lands.
    primerEl = null;
    primerRaw = '';
    primerSpokenUpto = 0;
    primerSpeaking = false;
    primerEnded = false;

    // Stream from /studio/chat
    console.log('[studio] POST /studio/chat — sending', {user, canvasId});
    try {
      const resp = await fetch('/studio/chat', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({
          history, user, canvas_id: canvasId,
          prior_canvas_ids: pinnedCanvasIds.slice(),
          session_id: sessionId,
        }),
      });
      console.log('[studio] response', resp.status, 'has body?', !!resp.body);
      if (!resp.ok || !resp.body) {
        asstEl.textContent = '(error: ' + resp.status + ')';
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let chunkCount = 0;
      while (true) {
        const {value, done} = await reader.read();
        if (done) { console.log('[studio] stream ended after', chunkCount, 'chunks'); break; }
        chunkCount++;
        const text = decoder.decode(value, {stream: true});
        console.log('[studio] chunk', chunkCount, text.slice(0, 200));
        buf += text;
        // SSE parser: split on event boundary.  sse-starlette emits
        // CRLF (`\r\n\r\n`), not LF — splitting on `\n\n` matched
        // nothing and the entire stream stayed buffered, which made
        // the chat panel look frozen.  Tolerate both CRLF and LF.
        let parts = buf.split(/\r?\n\r?\n/);
        buf = parts.pop();
        for (const part of parts) {
          const lines = part.split(/\r?\n/);
          let evt = 'message', data = '';
          for (const ln of lines) {
            if (ln.startsWith('event:')) evt = ln.slice(6).trim();
            else if (ln.startsWith('data:')) data += ln.slice(5).trim();
          }
          if (!data) continue;
          let payload;
          try { payload = JSON.parse(data); } catch { continue; }
          if (evt === 'text') {
            asstText += payload.text;
            asstEl.textContent = asstText;
            asstEl.style.opacity = '1';
            // Visual streaming only — audio is the canvas's job.
          } else if (evt === 'primer_chunk') {
            // Theory primer streams in parallel with the figure.  Each
            // delta is appended to the primer node; KaTeX re-renders
            // after a debounce so math nodes flip from $...$ to real
            // glyphs once the closing delimiter arrives.
            const delta = payload && payload.text;
            if (!delta) continue;
            // Server-side rescue sentinel: when the primer's
            // bare-LaTeX wrapper finds and fixes math that wasn't
            // wrapped in `$...$` delimiters, it sends one final
            // chunk prefixed with `\x00REPLACE\x00<full_text>`.
            // We wipe the streamed-so-far primerRaw and re-render
            // from the corrected text so KaTeX picks up the
            // newly-wrapped math.
            const REPLACE_PREFIX = '[[KMTRP_REPLACE_PRIMER]]';
            if (delta.startsWith(REPLACE_PREFIX)) {
              ensurePrimerEl(asstEl);
              primerRaw = delta.slice(REPLACE_PREFIX.length);
              primerEl.textContent = primerRaw;
              renderPrimerMath();
              // Don't re-speak — the user already heard the original
              // (which sounded fine; only the rendered text changed).
              continue;
            }
            ensurePrimerEl(asstEl);
            // The primer is now the loading indicator.  Hide the
            // redundant "Thinking…" tool bubble and the empty
            // assistant "…" placeholder so the chat doesn't show
            // three competing in-progress states at once.
            log.querySelectorAll('.msg.tool[data-tool]').forEach(t => {
              t.style.display = 'none';
            });
            if (!asstText) {
              asstEl.style.display = 'none';
            }
            primerRaw += delta;
            primerEl.textContent = primerRaw;
            renderPrimerMath();
            speakPrimerProgress(false);
            log.scrollTop = log.scrollHeight;
          } else if (evt === 'primer_done') {
            // Flush any tail-end residue that didn't hit a sentence
            // boundary, and re-render LaTeX in case the last $..$ was
            // still partial when the previous chunk arrived.
            primerEnded = true;
            renderPrimerMath();
            speakPrimerProgress(true);
          } else if (evt === 'tool_call') {
            // Show a generic "Thinking…" placeholder rather than the
            // raw tool name + args.  Learners don't care that the
            // backend is calling sevim_express(); they care that the
            // figure is being generated.  Failures still get a
            // concise error summary on tool_result.
            const tEl = document.createElement('div');
            tEl.className = 'msg tool';
            tEl.textContent = 'Thinking…';
            tEl.dataset.tool = payload.name;
            log.insertBefore(tEl, asstEl);
            log.scrollTop = log.scrollHeight;
          } else if (evt === 'svg_chunk') {
            // Progressive figure render: the express tool emits a
            // partial SVG as soon as the model has streamed enough of
            // it.  We forward to the canvas iframe; the iframe paints
            // the partial markup into its #stage so the learner sees
            // the figure draw itself instead of pop in fully formed.
            // First-turn (iframe not loaded yet) silently drops the
            // chunk — the full SVG arrives via tool_result a moment
            // later anyway.
            const partial = payload && payload.svg;
            if (partial && frame && frame.contentWindow &&
                frame.style.display !== 'none') {
              try {
                frame.contentWindow.postMessage({
                  type: 'sevim_partial_svg', svg: partial,
                }, '*');
              } catch (_) {}
            }
          } else if (evt === 'tool_result') {
            // Find the most-recent in-flight tool_call line and decorate
            // it with a success/failure summary so the user sees that
            // each call resolved, even when the model emits no chat text.
            const pending = log.querySelectorAll('.msg.tool[data-tool]');
            const last = pending[pending.length - 1];
            try {
              const r = JSON.parse(data);
              // Default: hide the placeholder entirely once the result
              // arrives — by the time the canvas is updated and the
              // assistant text streams in, the "Thinking…" line is
              // just visual noise.  Only KEEP the line on failure so
              // the learner sees what went wrong.
              let summary = '';
              if (r.error) {
                summary = 'Couldn\'t generate that figure — ' + String(r.error).slice(0, 80);
              } else if (Array.isArray(r.results)) {
                const ok = r.results.filter(x => !x.error).length;
                const err = r.results.length - ok;
                summary = err ? `Partial: ${ok} ok, ${err} err` : '';
              } else if (r.duration_s) {
                summary = '';   // Canvas + narration already convey success.
              } else if (r.canvas_id) {
                // Canvas link is visible in the iframe already; no
                // need to repeat the id in chat.
                summary = '';
              }
              if (last) {
                if (summary) {
                  // Show the summary (failure or partial-success).
                  last.textContent = summary;
                  last.classList.add(r.error ? 'tool-error' : 'tool-partial');
                  delete last.dataset.tool;
                } else {
                  // Success path: drop the "Thinking…" placeholder
                  // entirely — the canvas + assistant text are the
                  // real signal.
                  last.remove();
                }
              }
              if (r.canvas_id && r.canvas_id !== canvasId) {
                canvasId = r.canvas_id;
                placeholder.style.display = 'none';
                frame.style.display = 'block';
                frame.src = '/canvas/' + canvasId + '/view';
                // body.has-canvas tells the mobile CSS to switch from
                // chat-fills-screen back to the 38vh canvas / chat
                // split.  Setting it once is enough — the class
                // persists for the lifetime of the session.
                document.body.classList.add('has-canvas');
                // Mobile-only nudge: when the figure arrives the user
                // is typically still reading the streamed primer below,
                // so the canvas at the top of the viewport is out of
                // sight.  Scroll the canvas-pane into view and pulse
                // it briefly so the new figure isn't missed.  The
                // 'figure-arrived' class drives a one-shot keyframe
                // animation defined in CSS; it's auto-removed on
                // animationend so a subsequent new canvas re-fires it.
                if (window.matchMedia('(max-width: 900px)').matches) {
                  const pane = document.querySelector('.canvas-pane');
                  if (pane) {
                    pane.scrollIntoView({behavior: 'smooth', block: 'start'});
                    pane.classList.remove('figure-arrived');
                    void pane.offsetWidth;  // force reflow so re-add restarts the animation
                    pane.classList.add('figure-arrived');
                    pane.addEventListener('animationend', function _h() {
                      pane.classList.remove('figure-arrived');
                      pane.removeEventListener('animationend', _h);
                    });
                  }
                }
                if (canvasBadge) canvasBadge.textContent = canvasId;
                // Stash the canvasId on the assistant element so the pin
                // button (added on 'done') knows which canvas to pin.
                asstEl.dataset.canvasId = canvasId;
                persistHistory();
              }
            } catch {}
          } else if (evt === 'done') {
            // Pick where to anchor the 📌 pin button:
            //   * primer node if the primer streamed anything — that's
            //     the meatiest assistant bubble on the screen, so the
            //     pin attaches to it visually;
            //   * otherwise the assistant placeholder (un-hidden, since
            //     we suppressed it while the primer was streaming).
            let anchorEl = primerEl;
            if (!anchorEl) {
              if (!asstText) {
                asstEl.style.display = '';
                asstEl.textContent = '(figure built — see canvas →)';
                asstEl.style.opacity = '0.6';
              }
              anchorEl = asstEl;
            }
            // If this asst turn produced a canvas, attach a 📌 pin
            // button.  Clicking it adds the canvas to pinnedCanvasIds
            // so the next prompt's express call sees it as context.
            if (asstEl.dataset.canvasId) {
              const pinId = asstEl.dataset.canvasId;
              const pinBtn = document.createElement('button');
              pinBtn.type = 'button';
              pinBtn.style.cssText =
                'margin-left:0.5em;font-size:0.7em;padding:0.1em 0.45em;' +
                'border:1px solid var(--border);border-radius:999px;' +
                'background:transparent;color:var(--muted);cursor:pointer;';
              const refreshLabel = () => {
                pinBtn.textContent = pinnedCanvasIds.includes(pinId)
                  ? '📌 pinned (click to unpin)'
                  : '📌 pin for next prompt';
              };
              refreshLabel();
              pinBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const i = pinnedCanvasIds.indexOf(pinId);
                if (i >= 0) {
                  pinnedCanvasIds.splice(i, 1);
                } else {
                  pinnedCanvasIds.push(pinId);
                  // Cap at 3 to bound LLM cost.
                  if (pinnedCanvasIds.length > 3) pinnedCanvasIds.shift();
                }
                refreshLabel();
              });
              anchorEl.appendChild(pinBtn);
            }
            history.push({role: 'user', content: user});
            history.push({role: 'assistant', content: asstText || primerRaw});
            persistHistory();
          } else if (evt === 'error') {
            asstEl.textContent = '(error: ' + (payload.detail || 'unknown') + ')';
          }
        }
      }
    } catch (e) {
      asstEl.textContent = '(error: ' + e.message + ')';
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      sendBtn.classList.remove('loading');
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  // We INTENTIONALLY do NOT bind interruptNarration to input focus or
  // every keystroke — on mobile a casual tap on the input bar after
  // the first narration phrase plays would silence the remaining 14
  // phrases (the user complaint that surfaced as "narrative was just
  // one sentence").  The only places that genuinely need to stop the
  // old audio are (a) submitting a new turn — handled inside
  // sendMessage() — and (b) clicking the mic to dictate, which is
  // handled in the mic-button's own click handler.  Letting the
  // narration play to completion is the desired default.
  input.focus();

  // One-line "page is alive" log so it's obvious in DevTools whether
  // the bottom of the script ran (i.e. all listeners are bound).
  console.log('[studio] ready — chat handler bound, history len', history.length);

  // Cookie banner removed: only one strictly-necessary cookie
  // (sevim_auth) — no consent banner required.
</script>
</body>
</html>
